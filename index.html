<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>显生宙大陆风化交互数据库</title>
  <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f6f8; color: #1c2a33; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .page { max-width: 1740px; margin: 0 auto; padding: 24px; }
    .masthead { display: flex; justify-content: space-between; align-items: end; gap: 18px; padding: 0 3px 18px; }
    h1 { margin: 0; font-size: clamp(1.35rem, 2.7vw, 2rem); }
    .subtitle { margin: 7px 0 0; color: #60717c; }
    .tabs, .subtabs, .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button { border: 1px solid #c6d1d7; background: #fff; color: #263944; border-radius: 7px; padding: 8px 13px; font: inherit; cursor: pointer; }
    button:hover { border-color: #477a90; background: #f9fbfc; }
    button[aria-selected="true"] { background: #28677e; border-color: #28677e; color: #fff; }
    .card { overflow: hidden; background: #fff; border: 1px solid #d5e0e5; border-radius: 12px; box-shadow: 0 5px 20px rgba(34, 57, 71, .08); }
    .toolbar { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border-bottom: 1px solid #e2e9ec; background: #fbfcfc; }
    .toolbar-title { font-weight: 680; }
    .figure-wrap { padding: 8px; }
    #figure1-map { min-height: 500px; }
    #figure1-bc, #figure2 { min-height: 630px; }
    #figure2-panel { display: none; }
    .notice { margin: 0; padding: 11px 16px 14px; color: #5f707b; font-size: .89rem; }
    .loading { padding: 72px 16px; color: #637680; text-align: center; }
    @media (max-width: 760px) {
      .page { padding: 12px; }
      .masthead { display: block; }
      .tabs { margin-top: 15px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      #figure1-map { min-height: 380px; }
      #figure1-bc, #figure2 { min-height: 500px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div>
        <h1>显生宙大陆风化交互数据库</h1>
        <p class="subtitle">公开交互视图：图 1（A–C）与图 2</p>
      </div>
      <nav class="tabs" aria-label="图件选择">
        <button type="button" data-panel="figure1" aria-selected="true">图 1（A–C）</button>
        <button type="button" data-panel="figure2" aria-selected="false">图 2</button>
      </nav>
    </header>

    <section id="figure1-panel" class="card" aria-label="图 1 交互视图">
      <div class="toolbar">
        <span class="toolbar-title">图 1A：现代地理位置</span>
        <div class="actions"><button type="button" data-reset="figure1-map">重置地图视图</button></div>
      </div>
      <div class="figure-wrap"><div id="figure1-map" class="loading">正在载入图 1A…</div></div>
      <div class="toolbar"><span class="toolbar-title">图 1B–C：古纬度覆盖与年代分布</span><div class="actions"><button type="button" data-reset="figure1-bc">重置图件视图</button></div></div>
      <div class="figure-wrap"><div id="figure1-bc" class="loading">正在载入图 1B–C…</div></div>
      <p class="notice">支持滚轮缩放、拖动平移及右上方模式栏控件。公开版本不显示样品、文献或记录详情。</p>
    </section>

    <section id="figure2-panel" class="card" aria-label="图 2 交互视图">
      <div class="toolbar">
        <div class="subtabs" aria-label="图 2 子图选择">
          <button type="button" data-figure2="figure2a" aria-selected="true">图 2A</button>
          <button type="button" data-figure2="figure2b" aria-selected="false">图 2B</button>
          <button type="button" data-figure2="figure2c" aria-selected="false">图 2C</button>
        </div>
        <div class="actions"><button type="button" data-reset="figure2">重置图件视图</button></div>
      </div>
      <div class="figure-wrap"><div id="figure2" class="loading">正在载入图 2…</div></div>
      <p class="notice">支持滚轮缩放、拖动平移及右上方模式栏控件。公开版本不显示样品、文献或记录详情。</p>
    </section>
  </main>

  <script>
    const graphConfig = { displaylogo: false, responsive: true, scrollZoom: true };
    const payloads = new Map();
    const graphPayload = new Map();

    async function loadPayload(name) {
      if (!payloads.has(name)) {
        payloads.set(name, fetch(`data/${name}.json`).then((response) => {
          if (!response.ok) throw new Error(`无法载入 ${name}`);
          return response.json();
        }));
      }
      return payloads.get(name);
    }

    async function draw(id, name) {
      const payload = await loadPayload(name);
      graphPayload.set(id, payload);
      await Plotly.react(id, payload.data, payload.layout, graphConfig);
    }

    function reset(id) {
      const payload = graphPayload.get(id);
      if (payload) Plotly.react(id, payload.data, payload.layout, graphConfig);
    }

    function choosePanel(panel) {
      const figure1 = panel === 'figure1';
      document.getElementById('figure1-panel').style.display = figure1 ? 'block' : 'none';
      document.getElementById('figure2-panel').style.display = figure1 ? 'none' : 'block';
      document.querySelectorAll('[data-panel]').forEach((button) => button.setAttribute('aria-selected', String(button.dataset.panel === panel)));
    }

    async function chooseFigure2(name) {
      document.querySelectorAll('[data-figure2]').forEach((button) => button.setAttribute('aria-selected', String(button.dataset.figure2 === name)));
      await draw('figure2', name);
    }

    document.querySelectorAll('[data-panel]').forEach((button) => button.addEventListener('click', () => choosePanel(button.dataset.panel)));
    document.querySelectorAll('[data-figure2]').forEach((button) => button.addEventListener('click', () => chooseFigure2(button.dataset.figure2)));
    document.querySelectorAll('[data-reset]').forEach((button) => button.addEventListener('click', () => reset(button.dataset.reset)));
    Promise.all([draw('figure1-map', 'figure1_map'), draw('figure1-bc', 'figure1_bc'), chooseFigure2('figure2a')]).catch((error) => {
      document.querySelectorAll('.loading').forEach((node) => { node.textContent = `图件载入失败：${error.message}`; });
    });
  </script>
</body>
</html>
